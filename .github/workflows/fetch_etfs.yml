name: Fetch ETFs Data

on:
  schedule:
    # Weekdays: every 45 min, 09:15-15:15 IST (03:45-09:45 UTC).
    # Cron can't express a 45-min step across changing hours, so each
    # run time gets its own line. (15:15 IST is the last run on the
    # 45-min grid from 9:15; the next slot, 16:00 IST, is past 15:30.)
    - cron: '30 2 * * 1-5'  # 08:00 IST
    - cron: '45 3 * * 1-5'  # 09:15 IST
    - cron: '30 4 * * 1-5'  # 10:00 IST
    - cron: '15 5 * * 1-5'  # 10:45 IST
    - cron: '0 6 * * 1-5'   # 11:30 IST
    - cron: '45 6 * * 1-5'  # 12:15 IST
    - cron: '30 7 * * 1-5'  # 13:00 IST
    - cron: '15 8 * * 1-5'  # 13:45 IST
    - cron: '0 9 * * 1-5'   # 14:30 IST
    - cron: '45 9 * * 1-5'  # 15:15 IST
    # Weekend: snapshots at 03:30 and 05:00 UTC (09:00 and 10:30 IST) on Sat and Sun.
    - cron: '30 3 * * 6,0'
    - cron: '0 5 * * 6,0'
  workflow_dispatch:

# Serialize runs so two jobs never race on the same push.
concurrency:
  group: fetch-etfs
  cancel-in-progress: false

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch data
        env:
          ETF_ENDPOINT: ${{ secrets.ETF_ENDPOINT_URL }}
        run: |
          set -euo pipefail

          # GitHub's secret editor can keep a trailing newline on the pasted
          # value. A URL contains no whitespace, so strip all of it.
          ETF_ENDPOINT="$(printf '%s' "${ETF_ENDPOINT:-}" | tr -d '[:space:]')"

          if [ -z "${ETF_ENDPOINT}" ]; then
            echo "::error::ETF_ENDPOINT_URL secret is not set"
            exit 1
          fi

          case "${ETF_ENDPOINT}" in
            https://*) ;;
            *) echo "::error::ETF_ENDPOINT_URL does not start with https://"
               exit 1 ;;
          esac

          mkdir -p data

          # --fail turns HTTP errors into a non-zero exit instead of writing
          # the error page into the payload.
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            "${ETF_ENDPOINT}" -o raw.json

          # --slurpfile rejects anything that isn't valid JSON, so a bad
          # response fails here rather than getting committed.
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile d raw.json \
            '{last_updated: $ts, data: $d[0]}' > data/etfs.json

          rm raw.json

          echo "Rows fetched: $(jq '.data | length' data/etfs.json)"

      - name: Commit and push
        run: |
          set -euo pipefail

          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          # -f because data/etfs.json is listed in .gitignore.
          git add -f data/etfs.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update ETF data [skip ci]"

          git push || {
            git pull --rebase
            git push
          }
